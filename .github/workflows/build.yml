name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: '17'
      - run: dotnet workload install android
      - name: Compilar
        run: dotnet build "$(find . -name LauncherSV.csproj | head -1)" -c Debug -p:EmbedAssembliesIntoApk=true
      - uses: actions/upload-artifact@v4
        with:
          name: launcher-apk
          path: '**/*-Signed.apk'
